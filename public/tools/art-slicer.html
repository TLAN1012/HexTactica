<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexTactica 美術切圖工具</title>
<style>
  body { margin: 0; padding: 24px; background: #241e16; color: #f0e8d4;
         font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #9a8d70; font-size: 13.5px; margin: 0 0 18px; line-height: 1.7; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  select, input[type=range] { font-size: 14px; }
  select { background: #3a3226; color: #f0e8d4; border: 1px solid #5a4e3a; border-radius: 6px; padding: 6px 10px; }
  .drop { border: 2px dashed #5a4e3a; border-radius: 12px; padding: 30px; text-align: center;
          color: #9a8d70; cursor: pointer; margin-bottom: 18px; }
  .drop.over { border-color: #c9a85a; color: #c9a85a; }
  .cells { display: flex; gap: 12px; flex-wrap: wrap; }
  .cell { background: #3a3226; border: 1px solid #5a4e3a; border-radius: 10px; padding: 8px; text-align: center; }
  .cell canvas { width: 128px; height: 128px; border-radius: 6px; display: block; }
  .cell .name { font-size: 11.5px; font-family: monospace; color: #c9a85a; margin: 6px 0; }
  button { background: #2d6a3a; color: #fff; border: none; border-radius: 6px;
           padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  button.big { font-size: 15px; padding: 10px 24px; background: #ac4a2a; }
  label { font-size: 13.5px; }
</style>
<h1>🎨 HexTactica 美術切圖工具</h1>
<p class="sub">
  把 ChatGPT 生成的「合集圖」丟進來 → 自動切成一格一張、檔名正確的 PNG。<br>
  下載後放進 repo 的 <code>public/art/units/</code> 或 <code>public/art/terrain/</code> 即完成換裝。
  Prompt 見 repo 的 <code>ART_PROMPTS.md</code>。
</p>
<div class="row">
  <label>合集類型:
    <select id="preset">
      <option value="humans">合集 1 — 人類戰團(4×2)</option>
      <option value="orcs">合集 2 — 獸人戰團(4×2)</option>
      <option value="terrain">合集 3 — 地形(3×2)</option>
    </select>
  </label>
  <label>內縮裁切 <span id="cropVal">4</span>%:
    <input type="range" id="crop" min="0" max="15" value="4">
  </label>
  <button class="big" id="dlAll" style="display:none">⬇ 全部下載</button>
</div>
<div class="drop" id="drop">點這裡選擇圖片,或把合集圖拖進來</div>
<input type="file" id="file" accept="image/*" style="display:none">
<div class="cells" id="cells"></div>
<script>
const PRESETS = {
  humans: { cols: 4, rows: 2, names: [
    "infantry", "spearman", "archer", "longbow",
    "velite", "light-cavalry", "heavy-cavalry", null] },
  orcs: { cols: 4, rows: 2, names: [
    "orc-warrior", "orc-impaler", "orc-archer", "troll-slinger",
    "orc-axethrower", "wolf-rider", "troll-crusher", null] },
  terrain: { cols: 3, rows: 2, names: [
    "plains", "hills", "forest", "swamp", "river", null] },
};
const OUT = 512;
let img = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const cellsDiv = document.getElementById("cells");
const presetSel = document.getElementById("preset");
const cropRange = document.getElementById("crop");
const dlAll = document.getElementById("dlAll");

drop.onclick = () => fileInput.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files[0]) load(fileInput.files[0]); };
presetSel.onchange = slice;
cropRange.oninput = () => { document.getElementById("cropVal").textContent = cropRange.value; slice(); };

function load(file) {
  const url = URL.createObjectURL(file);
  const i = new Image();
  i.onload = () => { img = i; drop.textContent = "已載入:" + file.name + "(可重新拖入替換)"; slice(); };
  i.src = url;
}

function slice() {
  cellsDiv.innerHTML = "";
  if (!img) return;
  const p = PRESETS[presetSel.value];
  const cw = img.width / p.cols, ch = img.height / p.rows;
  const inset = Number(cropRange.value) / 100;
  const files = [];
  p.names.forEach((name, idx) => {
    if (!name) return;
    const cx = (idx % p.cols) * cw, cy = Math.floor(idx / p.cols) * ch;
    const canvas = document.createElement("canvas");
    canvas.width = OUT; canvas.height = OUT;
    const g = canvas.getContext("2d");
    const ix = cx + cw * inset, iy = cy + ch * inset;
    const iw = cw * (1 - 2 * inset), ih = ch * (1 - 2 * inset);
    // 取正方形中心
    const s = Math.min(iw, ih);
    g.drawImage(img, ix + (iw - s) / 2, iy + (ih - s) / 2, s, s, 0, 0, OUT, OUT);
    const div = document.createElement("div");
    div.className = "cell";
    const label = document.createElement("div");
    label.className = "name";
    label.textContent = name + ".png";
    const btn = document.createElement("button");
    btn.textContent = "下載";
    btn.onclick = () => download(canvas, name);
    div.append(canvas, label, btn);
    cellsDiv.appendChild(div);
    files.push({ canvas, name });
  });
  dlAll.style.display = "inline-block";
  dlAll.onclick = async () => {
    for (const f of files) {
      download(f.canvas, f.name);
      await new Promise((r) => setTimeout(r, 350)); // 避免瀏覽器擋連續下載
    }
  };
}

function download(canvas, name) {
  const a = document.createElement("a");
  a.download = name + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}
</script>
